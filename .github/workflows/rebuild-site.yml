name: Validate and test the archive

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # daily self-healing rebuild

# Never cancel a running deploy; bursts coalesce into one pending run.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Gate: nothing deploys unless the data validates and the generator's
  # test suite passes against this archive tip.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archive (branch tip, not trigger SHA)
        uses: actions/checkout@v4
        with:
          path: archive
          ref: main
          fetch-depth: 0   # the generator reads arrival times from git history

      - name: Checkout website (generator)
        uses: actions/checkout@v4
        with:
          repository: ToolAssisted-run/website
          path: website

      - name: Validate archive
        run: |
          pip install --quiet jsonschema
          python3 archive/validate.py

      - name: Generator tests
        run: python3 website/tests/test_generator.py archive

      - name: Output invariant tests
        run: python3 website/tests/test_output.py archive

      - name: Validator negative tests
        run: python3 website/tests/test_validate.py archive

      - name: Derivation tests
        run: python3 website/tests/test_derivation.py

      - name: Movie parser tests
        run: python3 website/tests/test_movieparse.py

# The deploy job that lived here mirrored the built site to Infomaniak over
# FTP. The site moved to GitHub Pages on 2026-08-17 and Pages can only be
# published from the repository that owns it, so this job could not do its
# work any more: it failed on the old host's 10 MB quota on every push, which
# is the very limit that caused the move. The website repository publishes
# now, and polls this branch on a schedule until it can be told directly.
#
# What stays here is the check: the generator has to be able to build the
# whole site from this archive, so content that would break the site is
# caught in the repository that holds the content.
  # Content changed, so the site is stale: tell the repository that publishes
  # it. Gated on the tests above, so content the generator cannot build a
  # whole site from never triggers a deploy. The token behind this dispatch
  # (ARCHIVE_ACTION_WRITE_SECRET) can do one thing: start workflows on the
  # website repository.
  rebuild-site:
    # Deliberately NOT gated on the heavy test job: that cost four to six
    # minutes of latency between a member's act and the site showing it, and
    # the website deploy refuses a build that fails or comes out incomplete
    # anyway. What gates the dispatch is the fast content check below, so an
    # archive the validator rejects still never triggers a deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the content first
        run: |
          pip install --quiet jsonschema
          python3 validate.py
      - name: Tell the website to rebuild
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_ACTION_WRITE_SECRET }}
        run: |
          gh workflow run deploy.yml -R ToolAssisted-run/website \
            --ref main -f reason=archive-content
          echo "asked the website to rebuild from this archive"
